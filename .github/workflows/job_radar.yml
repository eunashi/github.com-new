name: Run Job Radar

on:
  schedule:
    # 8 AM–4 PM PT during daylight saving
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
    # 6 PM PT
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure memory file exists
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi

      - name: Query OpenAI Job Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json << 'EOF'
          {
            "model": "gpt-5.4",
            "tools": [
              { "type": "web_search" }
            ],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are an executive job monitoring agent. Use web search to identify newly posted senior leadership roles.\n\nFocus on these seniorities:\nSenior Director\nDirector\nVice President\nHead of\nGeneral Manager level roles with strategic ownership\n\nPrimary functions:\nCorporate Strategy\nBusiness Strategy\nStrategy & Operations\nStrategic Programs\nStrategic Initiatives\n\nSecondary functions:\nBusiness Development\nStrategic Partnerships\nGTM Strategy\nGrowth Strategy\nAI Strategy\nPlatform Strategy\nEcosystem Strategy\nCommercial Strategy\nPortfolio Strategy\nAlliances\n\nIndustry focus:\nArtificial Intelligence\nCloud Infrastructure\nEnterprise Software\nData Platforms\nDeveloper Tools\nCybersecurity\nNetworking Infrastructure\nAI Infrastructure\nEdge Compute\n\nHigh priority companies but not exclusive:\nMicrosoft\nAmazon\nGoogle\nDatabricks\nSnowflake\nAnthropic\nNVIDIA ecosystem\nPalo Alto Networks\nF5\nEquinix\nOracle\nSalesforce\nAdobe\nExpedia\nCisco\nVisa\nWorkday\nPayPal\nNutanix\n\nLocation focus:\nSeattle WA\nBellevue WA\nRedmond WA\nSan Francisco Bay Area\nRemote United States\n\nFreshness rules:\nPrioritize jobs posted within the last 12 hours PT.\nInclude jobs posted within the last 72 hours if highly relevant.\nAlso include older jobs only when there is strong evidence of a recent repost, promotion refresh, or ATS refresh.\n\nDirect link rules:\nAlways prefer the most direct job URL from the company ATS or official job board.\nAvoid placeholder or truncated links.\nDo not use generic LinkedIn browse/search URLs when a more direct link exists.\n\nFreshness classification types:\nNew Listing\nRepost\nPromotion Refresh\nATS Refresh / Re-index\nPreviously Seen\nUnclear\n\nAlso assign Freshness Confidence:\nHigh\nMedium\nLow\n\nOUTPUT FORMAT\nReturn results strictly as a markdown table with columns:\n\n| Company | Job Title | Location | Posted | Signal Type | Freshness Confidence | Direct Link | Source | Why It Matches |\n\nIf no strong matches exist return exactly:\n\nNO_MATCHES"
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Search now for newly posted roles. Use queries like:\n\"Senior Director Strategy\" Seattle\n\"Director Strategy\" Bellevue\n\"Corporate Strategy Director\" Remote\n\"Strategic Partnerships Director\" Bay Area\n\"Senior Director Strategy\" \"Remote\"\nsite:linkedin.com/jobs \"Director Strategy\"\nsite:boards.greenhouse.io \"Director Strategy\"\nsite:jobs.lever.co \"Director Strategy\"\nsite:myworkdayjobs.com \"Director Strategy\"\nsite:smartrecruiters.com \"Director Strategy\"\nsite:ashbyhq.com \"Director Strategy\"\n\nReturn only strong matches, but do not be so strict that clearly relevant director-level strategy roles are excluded."
                  }
                ]
              }
            ]
          }
          EOF

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response
        run: |
          python - <<'PY'
          import json, pathlib

          data = json.load(open("openai_response.json", encoding="utf-8"))

          text = data.get("output_text", "")

          if not text:
              parts = []
              for o in data.get("output", []):
                  for c in o.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n".join(parts)

          if not text.strip():
              text = "NO_MATCHES"

          pathlib.Path("email_body.txt").write_text(text, encoding="utf-8")
          PY

      - name: Filter rows using freshness and seen logic
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          from datetime import datetime, timedelta, timezone

          body = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()
          debug = []

          if body == "NO_MATCHES":
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("OpenAI returned NO_MATCHES", encoding="utf-8")
              raise SystemExit

          seen_path = pathlib.Path("seen_jobs.json")
          raw_seen = json.loads(seen_path.read_text(encoding="utf-8"))

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=21)

          # Backward compatibility with old format: list of strings
          normalized_seen = []
          for item in raw_seen:
              if isinstance(item, str):
                  normalized_seen.append({"key": item, "first_seen": now.isoformat()})
              elif isinstance(item, dict) and "key" in item:
                  normalized_seen.append(item)

          # Drop old entries
          kept_seen = []
          seen_keys = set()
          for item in normalized_seen:
              ts = item.get("first_seen")
              keep = True
              try:
                  dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  if dt < cutoff:
                      keep = False
              except Exception:
                  pass
              if keep:
                  kept_seen.append(item)
                  seen_keys.add(item["key"])

          lines = [l for l in body.splitlines() if "|" in l]

          if len(lines) < 3:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("No parseable markdown table rows found", encoding="utf-8")
              raise SystemExit

          header = lines[0]
          separator = lines[1]
          data_rows = lines[2:]

          def posted_recent(posted_text: str) -> bool:
              t = posted_text.strip().lower()

              if t in ["just now", "today", "not stated", "new", "posted today", "crawled today"]:
                  return True

              if any(x in t for x in ["minute", "minutes", "min ago"]):
                  return True

              if any(x in t for x in ["hour", "hours", "hr ago", "hrs ago"]):
                  return True

              # allow up to 3 days
              m = re.search(r'(\\d+)\\s+day', t)
              if m and int(m.group(1)) <= 3:
                  return True

              return False

          def freshness_pass(posted: str, signal_type: str, confidence: str) -> bool:
              signal_type = signal_type.strip()
              confidence = confidence.strip()

              if signal_type == "Previously Seen":
                  return False

              if posted_recent(posted):
                  return True

              if signal_type in ["Repost", "Promotion Refresh", "ATS Refresh / Re-index"] and confidence in ["High", "Medium"]:
                  return True

              if signal_type == "New Listing" and confidence == "High":
                  return True

              return False

          def normalize_link(link: str) -> str:
              link = link.strip().strip("`").strip()
              link = link.replace("&utm_source=openai", "")
              link = re.sub(r"[?#].*$", "", link)

              placeholders = {
                  "",
                  "open job",
                  "https://www.linkedin.com/jobs/view/",
                  "https://www.linkedin.com/jobs/view/...",
                  "https://www.linkedin.com/jobs/view",
              }

              if link.lower() in placeholders:
                  return ""

              if "linkedin.com/jobs/search" in link.lower():
                  return ""

              return link.lower()

          def normalize_text(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"\\s+", " ", value)
              return value

          def build_key(company: str, title: str, location: str, link: str) -> str:
              nlink = normalize_link(link)
              company = normalize_text(company)
              title = normalize_text(title)
              location = normalize_text(location)

              if nlink:
                  return f"{company}|{title}|{location}|{nlink}"

              return f"{company}|{title}|{location}"

          total_rows = 0
          stale_or_low_conf = 0
          already_seen = 0
          malformed = 0

          new_rows = []
          new_seen_entries = []

          for line in data_rows:
              total_rows += 1
              parts = [p.strip() for p in line.split("|") if p.strip()]

              if len(parts) < 9:
                  malformed += 1
                  continue

              company = parts[0]
              title = parts[1]
              location = parts[2]
              posted = parts[3]
              signal_type = parts[4]
              confidence = parts[5]
              link = parts[6]

              if not freshness_pass(posted, signal_type, confidence):
                  stale_or_low_conf += 1
                  continue

              key = build_key(company, title, location, link)

              if key in seen_keys:
                  already_seen += 1
                  continue

              new_rows.append(line)
              new_seen_entries.append({"key": key, "first_seen": now.isoformat()})
              seen_keys.add(key)

          debug.append(f"Total parsed rows: {total_rows}")
          debug.append(f"Malformed rows skipped: {malformed}")
          debug.append(f"Rows filtered by freshness logic: {stale_or_low_conf}")
          debug.append(f"Rows filtered as already seen: {already_seen}")
          debug.append(f"Rows remaining to email: {len(new_rows)}")

          pathlib.Path("debug_summary.txt").write_text("\\n".join(debug), encoding="utf-8")

          if not new_rows:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
          else:
              final_seen = kept_seen + new_seen_entries
              seen_path.write_text(json.dumps(final_seen, indent=2), encoding="utf-8")
              final_table = "\\n".join([header, separator] + new_rows)
              pathlib.Path("email_body.txt").write_text(final_table, encoding="utf-8")
              pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
          PY

      - name: Show debug summary
        run: |
          echo "----- DEBUG SUMMARY -----"
          cat debug_summary.txt || true

      - name: Commit memory
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git pull --rebase origin main
          git commit -m "update job memory"
          git push origin HEAD:main

      - name: Convert table to HTML
        run: |
          python - <<'PY'
          import html
          import pathlib

          text = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()

          if not text:
              html_body = "<html><body><p>No matches</p></body></html>"
          else:
              rows = [r for r in text.splitlines() if r.startswith("|")]

              if len(rows) < 3:
                  html_body = f"<html><body><pre>{html.escape(text)}</pre></body></html>"
              else:
                  header = [c.strip() for c in rows[0].strip("|").split("|")]

                  html_body = "<html><body style='font-family:Arial,sans-serif;font-size:14px;'>"
                  html_body += "<p><strong>New Job Radar Matches</strong></p>"
                  html_body += "<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;'>"
                  html_body += "<tr>" + "".join(
                      f"<th style='background:#f2f2f2;text-align:left;'>{html.escape(h)}</th>"
                      for h in header
                  ) + "</tr>"

                  for r in rows[2:]:
                      cells = [c.strip() for c in r.strip("|").split("|")]
                      if len(cells) != len(header):
                          continue
                      html_body += "<tr>"
                      for idx, c in enumerate(cells):
                          cleaned = c.strip("`").strip()
                          if header[idx].lower() == "direct link" and cleaned.startswith("http"):
                              html_body += f"<td><a href='{html.escape(cleaned)}'>Open job</a></td>"
                          else:
                              html_body += f"<td>{html.escape(c)}</td>"
                      html_body += "</tr>"

                  html_body += "</table>"

                  html_body += """
                  <br><br>
                  <div style="font-size:12px;color:#444;">
                  <strong>Signal Type Legend</strong><br>
                  • <b>New Listing</b> – likely a genuinely new job posting<br>
                  • <b>Repost</b> – employer refreshed or reposted the listing<br>
                  • <b>Promotion Refresh</b> – boosted or promoted listing resurfacing<br>
                  • <b>ATS Refresh / Re-index</b> – feed or index refresh rather than a new posting<br>
                  • <b>Previously Seen</b> – job already surfaced in earlier radar runs<br>
                  • <b>Unclear</b> – insufficient evidence to determine freshness<br>
                  <br>
                  <strong>Freshness Confidence Legend</strong><br>
                  • <b>High</b> – strong direct or multiple consistent freshness signals<br>
                  • <b>Medium</b> – some evidence of recency, but partially ambiguous<br>
                  • <b>Low</b> – weak or conflicting freshness evidence, likely inferred indirectly<br>
                  </div>
                  """

                  html_body += "</body></html>"

          pathlib.Path("email_body.html").write_text(html_body, encoding="utf-8")
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          html_body = pathlib.Path("email_body.html").read_text(encoding="utf-8")
          text_body = pathlib.Path("email_body.txt").read_text(encoding="utf-8")

          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "New Job Radar Matches",
            "html": html_body,
            "text": text_body
          }

          pathlib.Path("resend_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
