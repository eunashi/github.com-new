name: Run Job Radar

on:
  schedule:
    - cron: '0 15-23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure memory file exists
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi

      - name: Query OpenAI Job Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json << 'EOF'
          {
            "model": "gpt-5.4",
            "tools": [{ "type": "web_search" }],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are an executive job monitoring agent. Use web search to identify newly posted or newly surfaced senior leadership roles.\n\nFocus on these seniorities:\nSenior Director\nDirector\nVice President\nHead of\nGeneral Manager level roles with strategic ownership\n\nPrimary functions:\nCorporate Strategy\nBusiness Strategy\nStrategy & Operations\nStrategic Programs\nStrategic Initiatives\n\nSecondary functions:\nBusiness Development\nStrategic Partnerships\nGTM Strategy\nGrowth Strategy\nAI Strategy\nPlatform Strategy\nEcosystem Strategy\nCommercial Strategy\nPortfolio Strategy\nAlliances\nChief of Staff\nBusiness Operations\nTransformation\nCorporate Development\n\nIndustry focus:\nArtificial Intelligence\nCloud Infrastructure\nEnterprise Software\nData Platforms\nDeveloper Tools\nCybersecurity\nNetworking Infrastructure\nAI Infrastructure\nEdge Compute\n\nHigh priority companies but not exclusive:\nMicrosoft\nAmazon\nGoogle\nDatabricks\nSnowflake\nAnthropic\nNVIDIA ecosystem\nPalo Alto Networks\nF5\nEquinix\nOracle\nSalesforce\nAdobe\nExpedia\nCisco\nVisa\nWorkday\nPayPal\nServiceNow\nCloudflare\n\nLocation focus:\nSeattle WA\nBellevue WA\nRedmond WA\nSan Francisco Bay Area\nRemote United States\n\nFreshness rules:\nPrioritize jobs posted within the last 24 hours, but also include roles that appear newly indexed, reposted, refreshed, promoted, or newly surfaced. Do not be overly restrictive.\n\nOUTPUT FORMAT\nReturn results strictly as a markdown table with columns:\n\n| Company | Job Title | Location | Posted | Direct Link | Source | Why It Matches |\n\nIf no plausible matches exist return exactly:\n\nNO_MATCHES"
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Search now for newly posted or newly surfaced senior leadership roles. Use multiple queries including:\n\n\"Senior Director Strategy\" Seattle\n\"Director Strategy\" Bellevue\n\"Corporate Strategy Director\" Remote\n\"Strategic Partnerships Director\" Bay Area\n\"Director Strategy and Operations\" Remote\n\"AI Strategy Director\" Seattle\n\"Director Strategic Initiatives\" Remote\n\"Director Business Operations\" strategy Remote\n\"Chief of Staff\" strategy director Remote\n\"Director Corporate Development\" Remote\nsite:linkedin.com/jobs \"Director Strategy\"\nsite:boards.greenhouse.io \"Director Strategy\"\nsite:jobs.lever.co \"Director Strategy\"\nsite:myworkdayjobs.com \"Director Strategy\"\nsite:smartrecruiters.com \"Director Strategy\"\nsite:ashbyhq.com \"Director Strategy\"\nMicrosoft Director Strategy jobs Redmond\nAmazon Director Strategy jobs Seattle\nGoogle Director Strategy jobs Bay Area\nSalesforce Director Strategy jobs Remote\nAdobe Director Strategy jobs\nExpedia Director Strategy jobs Seattle\nCisco Director Strategy jobs\nVisa Director Strategy jobs\nWorkday Director Strategy jobs\nPayPal Director Strategy jobs\nServiceNow Director Strategy jobs\nCloudflare Director Strategy jobs\n\nReturn strong and plausible matches in the required table format."
                  }
                ]
              }
            ]
          }
          EOF

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.load(open("openai_response.json", encoding="utf-8"))
          text = data.get("output_text", "")

          if not text:
              parts = []
              for item in data.get("output", []):
                  for c in item.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n\n".join(parts)

          if not text.strip():
              text = "NO_MATCHES"

          pathlib.Path("email_body.txt").write_text(text.strip(), encoding="utf-8")
          PY

      - name: Filter already seen jobs only
        run: |
          python - <<'PY'
          import json, pathlib

          body = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()
          seen_path = pathlib.Path("seen_jobs.json")
          seen = json.loads(seen_path.read_text(encoding="utf-8"))

          if body == "NO_MATCHES":
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("OpenAI returned NO_MATCHES", encoding="utf-8")
              raise SystemExit

          lines = [l for l in body.splitlines() if l.strip().startswith("|")]
          if len(lines) < 3:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("No parseable markdown table rows found", encoding="utf-8")
              raise SystemExit

          header, separator, rows = lines[0], lines[1], lines[2:]
          new_rows = []
          new_links = []

          for row in rows:
              cells = [c.strip() for c in row.strip("|").split("|")]
              if len(cells) < 5:
                  continue

              link = cells[4]
              if link and link in seen:
                  continue

              new_rows.append(row)
              if link:
                  new_links.append(link)

          pathlib.Path("debug_summary.txt").write_text(
              f"Rows returned: {len(rows)}\nRows remaining after seen filter: {len(new_rows)}",
              encoding="utf-8"
          )

          if not new_rows:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
          else:
              seen.extend(new_links)
              seen_path.write_text(json.dumps(seen, indent=2), encoding="utf-8")
              pathlib.Path("email_body.txt").write_text("\n".join([header, separator] + new_rows), encoding="utf-8")
              pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email via Resend
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json, os
          body = open("email_body.txt").read()
          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "New Job Radar Matches",
            "text": body
          }
          open("resend_payload.json", "w").write(json.dumps(payload))
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json

      - name: Send heartbeat email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          SEND_FLAG=$(cat send_email.txt 2>/dev/null || echo "false")
          if [ "$SEND_FLAG" = "true" ]; then
            exit 0
          fi

          python - <<'PY'
          import json, os, pathlib
          debug = pathlib.Path("debug_summary.txt").read_text(encoding="utf-8") if pathlib.Path("debug_summary.txt").exists() else "No debug summary available."
          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "Job Radar Heartbeat",
            "text": f"No new matches were found in this run.\n\n{debug}"
          }
          pathlib.Path("heartbeat_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @heartbeat_payload.json

      - name: Commit memory
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git pull --rebase origin main
          git commit -m "update job memory"
          git push origin HEAD:main
