name: Run Job Radar

on:
  schedule:
    # 8 AM to 4 PM PT
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query OpenAI with web search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json <<'JSON'
          {
            "model": "gpt-5.4",
            "tools": [
              {
                "type": "web_search"
              }
            ],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are a personal executive job search assistant. Use web search to find newly posted US-based leadership roles. Search broadly across LinkedIn Jobs, company career pages, Greenhouse, Lever, Workday, SmartRecruiters, Ashby, and Google-indexed job listings. Prioritize roles posted recently. Filter aggressively for these profiles: Director, Senior Director, Head, and comparable senior leadership roles. Functions: Strategy, Corporate Strategy, Business Development, Strategic Partnerships, Growth Strategy, GTM Strategy, Commercial Strategy, Portfolio Strategy, Ecosystem Partnerships, and Alliances. Geography: Seattle area, Bay Area, Remote US, plus exceptional US roles if highly relevant. Company types: large technology companies, AI and cloud infrastructure companies, enterprise software companies, cybersecurity companies, semiconductor and digital infrastructure companies, and telecom-adjacent technology companies. Example companies include but are not limited to Microsoft, Google, AWS, Nvidia ecosystem companies, Databricks, Snowflake, Anthropic ecosystem companies, Palo Alto Networks, CrowdStrike, F5, Equinix, Visa, Salesforce, Oracle, and ServiceNow. Return only strong matches."
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Find newly posted relevant jobs now. For each match, provide company, title, location, link, and a one-sentence fit rationale. If there are no strong matches, return exactly: NO_MATCHES."
                  }
                ]
              }
            ],
            "text": {
              "verbosity": "medium"
            }
          }
          JSON

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response text
        run: |
          python - <<'PY'
          import json

          with open("openai_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = ""

          if data.get("output_text"):
              text = data["output_text"]

          if not text:
              parts = []
              for item in data.get("output", []):
                  for c in item.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n\n".join(parts).strip()

          if not text:
              text = "NO_MATCHES"

          with open("email_body.txt", "w", encoding="utf-8") as f:
              f.write(text)

          if text.strip() == "NO_MATCHES":
              with open("send_email.txt", "w", encoding="utf-8") as f:
                  f.write("false")
          else:
              with open("send_email.txt", "w", encoding="utf-8") as f:
                  f.write("true")
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email via Resend
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("email_body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          payload = {
              "from": "Job Radar <onboarding@resend.dev>",
              "to": [os.environ["EMAIL_TO"]],
              "subject": "New Job Radar Matches",
              "text": body
          }

          with open("resend_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
