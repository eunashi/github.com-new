name: Run Job Radar

on:
  schedule:
    - cron: '0 15-23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure memory file exists
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi

      - name: Query OpenAI Job Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json << 'EOF'
          {
            "model": "gpt-5.4",
            "tools": [
              { "type": "web_search" }
            ],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are an executive job monitoring agent. Use web search to identify newly posted or newly surfaced senior leadership roles that match the candidate profile below. Search broadly across LinkedIn Jobs, company career pages, Greenhouse, Lever, Ashby, SmartRecruiters, Workday career portals, Built In, and other indexed job listings. Return strong and plausible matches. Do not be overly restrictive.\n\nCANDIDATE TARGET PROFILE\n\nSeniority:\nSenior Director\nDirector\nVice President\nHead of\nPrincipal-level strategy roles\nGeneral Manager level roles with strategic scope\n\nPrimary functions:\nCorporate Strategy\nBusiness Strategy\nStrategy & Operations\nStrategic Programs\nStrategic Initiatives\n\nSecondary functions:\nBusiness Development\nStrategic Partnerships\nGo-to-Market Strategy\nGrowth Strategy\nAI Strategy\nPlatform Strategy\nEcosystem Strategy\nCommercial Strategy\nPortfolio Strategy\nTransformation\nAlliances\nChief of Staff\nBusiness Operations\nCorporate Development\n\nIndustry focus:\nArtificial Intelligence\nCloud Infrastructure\nData Platforms\nEnterprise Software\nDeveloper Tools\nCybersecurity\nNetworking Infrastructure\nAI Infrastructure\nEdge Compute\nMarketplaces / travel tech\n\nHigh-priority companies, not exclusive:\nMicrosoft\nAmazon\nGoogle\nDatabricks\nSnowflake\nAnthropic\nNVIDIA ecosystem companies\nPalo Alto Networks\nF5\nEquinix\nOracle\nSalesforce\nAdobe\nExpedia\nCisco\nVisa\nWorkday\nPayPal\nNutanix\n\nLocation focus:\nSeattle WA\nBellevue WA\nRedmond WA\nSan Francisco Bay Area\nRemote United States\nOther strong US roles if fit is high\n\nFreshness guidance:\nPrioritize jobs posted or newly surfaced within the last 24 hours.\nInclude jobs that appear newly indexed, reposted, refreshed, crawled, promoted, or surfaced today.\nDo not be overly restrictive if the role is a strong fit and freshness is ambiguous.\n\nMatching rules:\nDo NOT require exact title matches.\nDo NOT exclude a role just because Strategy is not in the title.\nDo NOT exclude a role just because AI is not in the title.\nInclude adjacent strategic roles when responsibilities are clearly senior and strategic.\nWhen in doubt between excluding a plausible match and including it, include it.\n\nOUTPUT FORMAT\nReturn results strictly as a markdown table with these columns:\n\n| Company | Job Title | Location | Posted | Direct Link | Source | Why It Matches |\n\nThe Why It Matches field should be 1 to 2 concise executive-ready sentences.\n\nIf no strong matches exist return exactly: NO_MATCHES"
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Search now for newly surfaced senior strategy, AI strategy, corporate strategy, business operations, GTM strategy, strategic partnerships, alliances, transformation, platform strategy, growth strategy, commercial strategy, portfolio strategy, chief of staff, and corporate development roles.\n\nUse multiple broad queries including:\n\"Senior Director Strategy\" Seattle\n\"Director Strategy\" Bellevue\n\"Corporate Strategy Director\" Remote\n\"Strategic Partnerships Director\" Bay Area\n\"Director Strategy and Operations\" Remote\n\"AI Strategy Director\" Seattle\n\"Director Strategic Initiatives\" Remote\n\"Director Business Operations\" strategy Remote\n\"Director GTM Strategy\" Remote\n\"Director Platform Strategy\" Remote\n\"Director Growth Strategy\" Remote\n\"Chief of Staff\" strategy director Remote\nsite:linkedin.com/jobs \"Director Strategy\"\nsite:boards.greenhouse.io \"Director Strategy\"\nsite:jobs.lever.co \"Director Strategy\"\nsite:myworkdayjobs.com \"Director Strategy\"\nsite:smartrecruiters.com \"Director Strategy\"\nsite:ashbyhq.com \"Director Strategy\"\n\nSearch broadly across LinkedIn, Greenhouse, Lever, Workday, SmartRecruiters, Ashby, Built In, and company career sites. Return strong and plausible matches in the required table format."
                  }
                ]
              }
            ]
          }
          EOF

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response
        run: |
          python - <<'PY'
          import json, pathlib

          data = json.load(open("openai_response.json", encoding="utf-8"))
          text = data.get("output_text", "")

          if not text:
              parts = []
              for o in data.get("output", []):
                  for c in o.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n".join(parts)

          if not text.strip():
              text = "NO_MATCHES"

          pathlib.Path("email_body.txt").write_text(text, encoding="utf-8")
          PY

      - name: Filter already-seen jobs only
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          from datetime import datetime, timedelta, timezone

          body = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()
          seen_path = pathlib.Path("seen_jobs.json")
          raw_seen = json.loads(seen_path.read_text(encoding="utf-8"))

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=30)
          debug = []

          normalized_seen = []
          for item in raw_seen:
              if isinstance(item, str):
                  normalized_seen.append({"key": item, "first_seen": now.isoformat()})
              elif isinstance(item, dict) and "key" in item:
                  normalized_seen.append(item)

          kept_seen = []
          seen_keys = set()

          for item in normalized_seen:
              ts = item.get("first_seen")
              keep = True
              try:
                  dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  if dt < cutoff:
                      keep = False
              except Exception:
                  pass

              if keep:
                  kept_seen.append(item)
                  seen_keys.add(item["key"])

          if body == "NO_MATCHES":
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("heartbeat.txt").write_text("true", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("OpenAI returned NO_MATCHES", encoding="utf-8")
              raise SystemExit

          lines = [l for l in body.splitlines() if l.strip().startswith("|")]

          if len(lines) < 3:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("heartbeat.txt").write_text("true", encoding="utf-8")
              pathlib.Path("debug_summary.txt").write_text("No parseable markdown table rows found", encoding="utf-8")
              raise SystemExit

          header = lines[0]
          separator = lines[1]
          data_rows = lines[2:]

          def normalize_link(link: str) -> str:
              link = link.strip().strip("`").strip()
              link = re.sub(r"[?#].*$", "", link)

              if not link:
                  return ""

              bad_links = {
                  "open job",
                  "https://www.linkedin.com/jobs/view/",
                  "https://www.linkedin.com/jobs/view/...",
                  "https://www.linkedin.com/jobs/view"
              }

              if link.lower() in bad_links:
                  return ""

              if "linkedin.com/jobs/search" in link.lower():
                  return ""

              return link.lower()

          def normalize_text(value: str) -> str:
              value = value.strip().lower()
              value = re.sub(r"\s+", " ", value)
              return value

          def build_key(company: str, title: str, location: str, link: str) -> str:
              company = normalize_text(company)
              title = normalize_text(title)
              location = normalize_text(location)
              nlink = normalize_link(link)

              if nlink:
                  return f"{company}|{title}|{location}|{nlink}"

              return f"{company}|{title}|{location}"

          total_rows = 0
          malformed = 0
          already_seen = 0
          new_rows = []
          new_seen_entries = []

          for line in data_rows:
              total_rows += 1
              cells = [c.strip() for c in line.strip("|").split("|")]

              if len(cells) < 7:
                  malformed += 1
                  continue

              company = cells[0]
              title = cells[1]
              location = cells[2]
              link = cells[4]

              key = build_key(company, title, location, link)

              if key in seen_keys:
                  already_seen += 1
                  continue

              new_rows.append(line)
              new_seen_entries.append({"key": key, "first_seen": now.isoformat()})
              seen_keys.add(key)

          debug.append(f"Total parsed rows: {total_rows}")
          debug.append(f"Malformed rows skipped: {malformed}")
          debug.append(f"Rows filtered as already seen: {already_seen}")
          debug.append(f"Rows remaining to email: {len(new_rows)}")
          debug.append("Strict freshness filter disabled. Search prompt handles recency instead.")

          pathlib.Path("debug_summary.txt").write_text("\n".join(debug), encoding="utf-8")

          if not new_rows:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              pathlib.Path("heartbeat.txt").write_text("true", encoding="utf-8")
          else:
              final_seen = kept_seen + new_seen_entries
              seen_path.write_text(json.dumps(final_seen, indent=2), encoding="utf-8")

              final_table = "\n".join([header, separator] + new_rows)
              pathlib.Path("email_body.txt").write_text(final_table, encoding="utf-8")
              pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
              pathlib.Path("heartbeat.txt").write_text("false", encoding="utf-8")
          PY

      - name: Show debug summary
        run: |
          echo "----- DEBUG SUMMARY -----"
          cat debug_summary.txt || true

      - name: Commit memory
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git pull --rebase origin main
          git commit -m "update job memory"
          git push origin HEAD:main

      - name: Convert table to HTML
        if: always()
        run: |
          python - <<'PY'
          import html
          import pathlib

          text = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip() if pathlib.Path("email_body.txt").exists() else ""

          if not text or text == "NO_MATCHES":
              html_body = "<html><body><p>No matches</p></body></html>"
          else:
              rows = [r for r in text.splitlines() if r.strip().startswith("|")]

              if len(rows) < 3:
                  html_body = f"<html><body><pre>{html.escape(text)}</pre></body></html>"
              else:
                  header = [c.strip() for c in rows[0].strip("|").split("|")]

                  html_body = "<html><body style='font-family:Arial,sans-serif;font-size:14px;'>"
                  html_body += "<p><strong>New Job Radar Matches</strong></p>"
                  html_body += "<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;'>"
                  html_body += "<tr>" + "".join(
                      f"<th style='background:#f2f2f2;text-align:left;'>{html.escape(h)}</th>"
                      for h in header
                  ) + "</tr>"

                  for r in rows[2:]:
                      cells = [c.strip() for c in r.strip("|").split("|")]
                      if len(cells) != len(header):
                          continue

                      html_body += "<tr>"
                      for idx, c in enumerate(cells):
                          cleaned = c.strip("`").strip()
                          if header[idx].lower() == "direct link" and cleaned.startswith("http"):
                              html_body += f"<td><a href='{html.escape(cleaned)}'>Open job</a></td>"
                          else:
                              html_body += f"<td>{html.escape(c)}</td>"
                      html_body += "</tr>"

                  html_body += "</table>"
                  html_body += "</body></html>"

          pathlib.Path("email_body.html").write_text(html_body, encoding="utf-8")
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          html_body = pathlib.Path("email_body.html").read_text(encoding="utf-8")
          text_body = pathlib.Path("email_body.txt").read_text(encoding="utf-8")

          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "New Job Radar Matches",
            "html": html_body,
            "text": text_body
          }

          pathlib.Path("resend_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json

      - name: Send heartbeat email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          HEARTBEAT=$(cat heartbeat.txt 2>/dev/null || echo "false")
          if [ "$HEARTBEAT" != "true" ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          import html

          debug = pathlib.Path("debug_summary.txt").read_text(encoding="utf-8") if pathlib.Path("debug_summary.txt").exists() else "No debug summary available."

          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "Job Radar Heartbeat",
            "html": f"<html><body><p>No new matches were found in this run.</p><pre>{html.escape(debug)}</pre></body></html>",
            "text": f"Job Radar heartbeat\n\nNo new matches were found in this run.\n\n{debug}"
          }

          pathlib.Path("heartbeat_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @heartbeat_payload.json
