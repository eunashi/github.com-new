name: Run Job Radar

on:
  schedule:
    # 8 AM to 4 PM PT during daylight saving
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
    # 6 PM PT
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure memory files exist
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi
          if [ ! -f last_heartbeat.txt ]; then
            echo "" > last_heartbeat.txt
          fi

      - name: Query OpenAI Job Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json << 'EOF'
          {
            "model": "gpt-5.4",
            "tools": [
              { "type": "web_search" }
            ],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are an executive job monitoring agent. Use web search to identify newly posted senior leadership roles.\n\nFocus on these seniorities:\nSenior Director\nDirector\nVice President\nHead of\nGeneral Manager level roles with strategic ownership\n\nPrimary functions:\nCorporate Strategy\nBusiness Strategy\nStrategy & Operations\nStrategic Programs\nStrategic Initiatives\n\nSecondary functions:\nBusiness Development\nStrategic Partnerships\nGTM Strategy\nGrowth Strategy\nAI Strategy\nPlatform Strategy\nEcosystem Strategy\nCommercial Strategy\nPortfolio Strategy\nAlliances\n\nIndustry focus:\nArtificial Intelligence\nCloud Infrastructure\nEnterprise Software\nData Platforms\nDeveloper Tools\nCybersecurity\nNetworking Infrastructure\nAI Infrastructure\nEdge Compute\n\nHigh priority companies but not exclusive:\nMicrosoft\nAmazon\nGoogle\nDatabricks\nSnowflake\nAnthropic\nNVIDIA ecosystem\nPalo Alto Networks\nF5\nEquinix\nOracle\n\nLocation focus:\nSeattle WA\nBellevue WA\nRedmond WA\nSan Francisco Bay Area\nRemote United States\n\nFreshness rules:\nPrioritize jobs posted within the last 5 hours PT.\nInclude jobs posted within the last 24 hours if highly relevant.\nFor older original postings, still include them when there is strong evidence of a recent repost, promotion refresh, or ATS refresh.\n\nFreshness classification types:\nNew Listing\nRepost\nPromotion Refresh\nATS Refresh / Re-index\nPreviously Seen\nUnclear\n\nAlso assign Freshness Confidence:\nHigh\nMedium\nLow\n\nOUTPUT FORMAT\nReturn results strictly as a markdown table with columns:\n\n| Company | Job Title | Location | Posted | Signal Type | Freshness Confidence | Direct Link | Source | Why It Matches |\n\nIf no strong matches exist return exactly:\n\nNO_MATCHES"
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Search now for newly posted roles. Use queries like:\n\"Senior Director Strategy\" Seattle\n\"Director Strategy\" Bellevue\n\"Corporate Strategy Director\" Remote\n\"Strategic Partnerships Director\" Bay Area\nsite:linkedin.com/jobs \"Director Strategy\"\nsite:boards.greenhouse.io \"Director Strategy\"\nsite:jobs.lever.co \"Director Strategy\"\nsite:myworkdayjobs.com \"Director Strategy\"\nsite:smartrecruiters.com \"Director Strategy\"\n\nReturn only strong matches."
                  }
                ]
              }
            ]
          }
          EOF

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response
        run: |
          python - <<'PY'
          import json
          import pathlib

          data = json.load(open("openai_response.json", encoding="utf-8"))

          text = data.get("output_text", "")

          if not text:
              parts = []
              for o in data.get("output", []):
                  for c in o.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n".join(parts)

          if not text.strip():
              text = "NO_MATCHES"

          pathlib.Path("email_body.txt").write_text(text, encoding="utf-8")
          PY

      - name: Filter rows using freshness, seen logic, and heartbeat
        run: |
          python - <<'PY'
          import json
          import pathlib
          from datetime import datetime, timezone

          body = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()
          seen = json.loads(pathlib.Path("seen_jobs.json").read_text(encoding="utf-8"))
          heartbeat_file = pathlib.Path("last_heartbeat.txt")

          def should_send_heartbeat() -> bool:
              today_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              last_sent = heartbeat_file.read_text(encoding="utf-8").strip() if heartbeat_file.exists() else ""

              if last_sent != today_utc:
                  heartbeat_file.write_text(today_utc, encoding="utf-8")
                  return True
              return False

          if body == "NO_MATCHES":
              heartbeat_due = should_send_heartbeat()
              if heartbeat_due:
                  heartbeat_text = (
                      "Job Radar heartbeat\n\n"
                      "No strong new matches were found in this run.\n"
                      "This email confirms the workflow is still running normally."
                  )
                  pathlib.Path("email_body.txt").write_text(heartbeat_text, encoding="utf-8")
                  pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
                  pathlib.Path("email_subject.txt").write_text("Job Radar Heartbeat", encoding="utf-8")
                  pathlib.Path("debug_summary.txt").write_text(
                      "OpenAI returned NO_MATCHES. Sending daily heartbeat.",
                      encoding="utf-8"
                  )
              else:
                  pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
                  pathlib.Path("email_subject.txt").write_text("Job Radar", encoding="utf-8")
                  pathlib.Path("debug_summary.txt").write_text(
                      "OpenAI returned NO_MATCHES. No heartbeat due.",
                      encoding="utf-8"
                  )
              raise SystemExit

          lines = [l for l in body.splitlines() if "|" in l]

          if len(lines) < 3:
              heartbeat_due = should_send_heartbeat()
              if heartbeat_due:
                  heartbeat_text = (
                      "Job Radar heartbeat\n\n"
                      "The workflow ran, but no parseable markdown table rows were found.\n"
                      "Please review the latest run logs."
                  )
                  pathlib.Path("email_body.txt").write_text(heartbeat_text, encoding="utf-8")
                  pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
                  pathlib.Path("email_subject.txt").write_text("Job Radar Heartbeat", encoding="utf-8")
                  pathlib.Path("debug_summary.txt").write_text(
                      "No parseable markdown table rows found. Sending daily heartbeat.",
                      encoding="utf-8"
                  )
              else:
                  pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
                  pathlib.Path("email_subject.txt").write_text("Job Radar", encoding="utf-8")
                  pathlib.Path("debug_summary.txt").write_text(
                      "No parseable markdown table rows found. No heartbeat due.",
                      encoding="utf-8"
                  )
              raise SystemExit

          header = lines[0]
          separator = lines[1]
          data_rows = lines[2:]
          total_jobs_found = len(data_rows)

          def posted_recent(posted_text: str) -> bool:
              t = posted_text.strip().lower()
              return any(x in t for x in [
                  "just now", "today", "minute", "minutes", "min ago",
                  "hour", "hours", "hr ago", "hrs ago", "not stated"
              ])

          def freshness_pass(posted: str, signal_type: str, confidence: str) -> bool:
              if signal_type.strip() == "Previously Seen":
                  return False
              if posted_recent(posted):
                  return True
              return signal_type.strip() in [
                  "Repost", "Promotion Refresh", "ATS Refresh / Re-index", "New Listing"
              ] and confidence.strip() in ["High", "Medium"]

          new_rows = []
          new_links = []

          for line in data_rows:
              parts = [p.strip() for p in line.split("|") if p.strip()]
              if len(parts) < 9:
                  continue

              posted = parts[3]
              signal_type = parts[4]
              confidence = parts[5]
              link = parts[6]

              if not freshness_pass(posted, signal_type, confidence):
                  continue
              if link in seen:
                  continue

              new_rows.append(line)
              new_links.append(link)

          new_jobs_found = len(new_rows)
          heartbeat_due = should_send_heartbeat()

          send_email_flag = (
              new_jobs_found > 0
              or total_jobs_found >= 5
              or heartbeat_due
          )

          reasons = []
          if new_jobs_found > 0:
              reasons.append(f"{new_jobs_found} new job(s)")
          if total_jobs_found >= 5:
              reasons.append(f"{total_jobs_found} total jobs found")
          if heartbeat_due:
              reasons.append("daily heartbeat")

          if new_links:
              seen.extend(new_links)
              pathlib.Path("seen_jobs.json").write_text(json.dumps(seen, indent=2), encoding="utf-8")

          if new_rows:
              final_table = "\n".join([header, separator] + new_rows)
              pathlib.Path("email_body.txt").write_text(final_table, encoding="utf-8")
              pathlib.Path("email_subject.txt").write_text("New Job Radar Matches", encoding="utf-8")
          elif total_jobs_found >= 5:
              full_table = "\n".join([header, separator] + data_rows)
              pathlib.Path("email_body.txt").write_text(full_table, encoding="utf-8")
              pathlib.Path("email_subject.txt").write_text("Job Radar Update", encoding="utf-8")
          elif heartbeat_due:
              heartbeat_text = (
                  "Job Radar heartbeat\n\n"
                  "The workflow ran successfully, but there were no new qualifying matches in this run."
              )
              pathlib.Path("email_body.txt").write_text(heartbeat_text, encoding="utf-8")
              pathlib.Path("email_subject.txt").write_text("Job Radar Heartbeat", encoding="utf-8")
          else:
              pathlib.Path("email_subject.txt").write_text("Job Radar", encoding="utf-8")

          pathlib.Path("send_email.txt").write_text("true" if send_email_flag else "false", encoding="utf-8")
          pathlib.Path("debug_summary.txt").write_text(
              "\n".join([
                  f"Total jobs fetched: {total_jobs_found}",
                  f"New jobs after filter: {new_jobs_found}",
                  f"Heartbeat due: {heartbeat_due}",
                  f"Send email: {send_email_flag}",
                  f"Email trigger reason: {', '.join(reasons) if reasons else 'no trigger'}"
              ]),
              encoding="utf-8"
          )
          PY

      - name: Commit memory
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

          git add seen_jobs.json last_heartbeat.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update job memory"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          email_body = pathlib.Path("email_body.txt").read_text(encoding="utf-8")
          email_subject = pathlib.Path("email_subject.txt").read_text(encoding="utf-8").strip()

          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": email_subject,
            "text": email_body
          }

          pathlib.Path("resend_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
