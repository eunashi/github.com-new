name: Run Job Radar

on:
  schedule:
    # 8 AM – 4 PM PT
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query OpenAI for new jobs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-5.4",
              "input": "Search broadly across the internet for newly posted Senior Director or Director roles in Strategy, Business Development, GTM, or Strategic Partnerships. Focus on Seattle, Bay Area, or Remote US. Search LinkedIn Jobs, Greenhouse, Lever, Workday, SmartRecruiters, Ashby, and company career pages. Return only strong matches. If none exist respond exactly: NO_MATCHES."
            }' \
            -o openai_response.json

      - name: Extract response text
        run: |
          python - <<'PY'
          import json

          with open("openai_response.json") as f:
              data=json.load(f)

          text=""

          if "output_text" in data:
              text=data["output_text"]

          if not text:
              for o in data.get("output",[]):
                  for c in o.get("content",[]):
                      if c.get("type")=="output_text":
                          text+=c.get("text","")

          text=text.strip()

          with open("email_body.txt","w") as f:
              f.write(text)

          if text=="NO_MATCHES" or len(text)<5:
              open("send_email.flag","w").write("0")
          else:
              open("send_email.flag","w").write("1")
          PY

      - name: Send email only if jobs exist
        if: ${{ hashFiles('send_email.flag') != '' && steps.extract_response_text.outputs != '0' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: New Job Radar Matches
          to: ${{ secrets.EMAIL_TO }}
          from: Job Radar <${{ secrets.EMAIL_USERNAME }}>
          body_file: email_body.txt
