name: Run Job Radar

on:
  schedule:
    # 8 AM–4 PM PT
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query OpenAI for jobs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-5.4",
              "input": "Search broadly across the internet for newly posted Senior Director or Director roles in Strategy, Business Development, GTM, or Strategic Partnerships. Focus on Seattle, Bay Area, or Remote US. Search LinkedIn Jobs, Greenhouse, Lever, Workday, SmartRecruiters, Ashby, and company career pages. Return only strong matches. For each role include company, title, location, link, and one sentence on why it fits. If none exist respond exactly: NO_MATCHES."
            }' \
            -o openai_response.json

      - name: Extract response text and decide whether to send
        run: |
          python - <<'PY'
          import json

          with open("openai_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = ""

          if data.get("output_text"):
              text = data["output_text"]

          if not text:
              parts = []
              for item in data.get("output", []):
                  for c in item.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n\n".join(parts).strip()

          with open("email_body.txt", "w", encoding="utf-8") as f:
              f.write(text if text else "NO_MATCHES")

          send_email = "true"
          if not text or text.strip() == "NO_MATCHES":
              send_email = "false"

          with open("send_email.txt", "w", encoding="utf-8") as f:
              f.write(send_email)
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email via Resend
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("email_body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          payload = {
              "from": "Job Radar <onboarding@resend.dev>",
              "to": [os.environ["EMAIL_TO"]],
              "subject": "New Job Radar Matches",
              "text": body
          }

          with open("resend_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
