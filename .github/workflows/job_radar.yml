name: Run Job Radar

on:
  schedule:
    # 8 AM to 4 PM PT
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query OpenAI for jobs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-5.4",
              "input": "Use Google indexed results to identify newly posted Senior Director or Director roles in Strategy, Business Development, GTM, or Strategic Partnerships. Search queries like: site:linkedin.com/jobs \"Director Strategy\", site:boards.greenhouse.io \"Director\", site:jobs.lever.co \"Director\", site:myworkdayjobs.com \"Director\", site:smartrecruiters.com \"Director\". Focus on Seattle, Bay Area, or Remote US. Return only roles likely posted within the last few days. Provide company, title, location, and link. If no strong matches exist respond exactly: NO_MATCHES."
            }' \
            -o openai_response.json

      - name: Extract response text and prepare email
        run: |
          python - <<'PY'
          import json

          with open("openai_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = ""

          if data.get("output_text"):
              text = data["output_text"]

          if not text:
              parts = []
              for item in data.get("output", []):
                  for c in item.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n\n".join(parts).strip()

          if not text:
              text = "NO_MATCHES"

          with open("email_body.txt", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Force email sending for debug
        id: sendflag
        run: echo "value=true" >> "$GITHUB_OUTPUT"

      - name: Send email via Resend
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("email_body.txt", "r", encoding="utf-8") as f:
              body = f.read()

          payload = {
              "from": "Job Radar <onboarding@resend.dev>",
              "to": [os.environ["EMAIL_TO"]],
              "subject": "Job Radar Debug Results",
              "text": body
          }

          with open("resend_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
