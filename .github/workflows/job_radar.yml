name: Run Job Radar

on:
  schedule:
    # 8 AM–4 PM PT
    - cron: '0 15-23 * * *'
    # 5 PM PT
    - cron: '0 0 * * *'
    # 6 PM PT
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure memory file exists
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "[]" > seen_jobs.json
          fi

      - name: Query OpenAI Job Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > payload.json << 'EOF'
          {
            "model": "gpt-5.4",
            "tools": [
              { "type": "web_search" }
            ],
            "tool_choice": "auto",
            "input": [
              {
                "role": "developer",
                "content": [
                  {
                    "type": "input_text",
                    "text": "You are an executive job monitoring agent. Use web search to identify newly posted senior leadership roles.\n\nFocus on these seniorities:\nSenior Director\nDirector\nVice President\nHead of\nGeneral Manager level roles with strategic ownership\n\nPrimary functions:\nCorporate Strategy\nBusiness Strategy\nStrategy & Operations\nStrategic Programs\nStrategic Initiatives\n\nSecondary functions:\nBusiness Development\nStrategic Partnerships\nGTM Strategy\nGrowth Strategy\nAI Strategy\nPlatform Strategy\nEcosystem Strategy\nCommercial Strategy\nPortfolio Strategy\nAlliances\n\nIndustry focus:\nArtificial Intelligence\nCloud Infrastructure\nEnterprise Software\nData Platforms\nDeveloper Tools\nCybersecurity\nNetworking Infrastructure\nAI Infrastructure\nEdge Compute\n\nHigh priority companies but not exclusive:\nMicrosoft\nAmazon\nGoogle\nDatabricks\nSnowflake\nAnthropic\nNVIDIA ecosystem\nPalo Alto Networks\nF5\nEquinix\nOracle\n\nLocation focus:\nSeattle WA\nBellevue WA\nRedmond WA\nSan Francisco Bay Area\nRemote United States\n\nFreshness rules:\nPrioritize jobs posted within the last 5 hours PT.\nInclude jobs posted within the last 24 hours if highly relevant.\n\nFreshness classification types:\nNew Listing\nRepost\nPromotion Refresh\nATS Refresh / Re-index\nPreviously Seen\nUnclear\n\nAlso assign Freshness Confidence:\nHigh\nMedium\nLow\n\nOUTPUT FORMAT\nReturn results strictly as a markdown table with columns:\n\n| Company | Job Title | Location | Posted | Signal Type | Freshness Confidence | Direct Link | Source | Why It Matches |\n\nIf no strong matches exist return exactly:\n\nNO_MATCHES"
                  }
                ]
              },
              {
                "role": "user",
                "content": [
                  {
                    "type": "input_text",
                    "text": "Search now for newly posted roles. Use queries like:\n\"Senior Director Strategy\" Seattle\n\"Director Strategy\" Bellevue\n\"Corporate Strategy Director\" Remote\n\"Strategic Partnerships Director\" Bay Area\nsite:linkedin.com/jobs \"Director Strategy\"\nsite:boards.greenhouse.io \"Director Strategy\"\nsite:jobs.lever.co \"Director Strategy\"\nsite:myworkdayjobs.com \"Director Strategy\"\nsite:smartrecruiters.com \"Director Strategy\"\n\nReturn only strong matches."
                  }
                ]
              }
            ]
          }
          EOF

          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o openai_response.json

      - name: Extract response
        run: |
          python - <<'PY'
          import json, pathlib

          data = json.load(open("openai_response.json"))

          text = data.get("output_text", "")

          if not text:
              parts = []
              for o in data.get("output", []):
                  for c in o.get("content", []):
                      if c.get("type") == "output_text":
                          parts.append(c.get("text", ""))
              text = "\n".join(parts)

          if not text.strip():
              text = "NO_MATCHES"

          pathlib.Path("email_body.txt").write_text(text, encoding="utf-8")
          PY

      - name: Filter already seen jobs
        run: |
          python - <<'PY'
          import json, pathlib

          body = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()

          if body == "NO_MATCHES":
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              raise SystemExit

          seen = json.loads(pathlib.Path("seen_jobs.json").read_text(encoding="utf-8"))

          lines = [l for l in body.splitlines() if "|" in l]

          if len(lines) < 3:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
              raise SystemExit

          header = lines[0]
          separator = lines[1]
          data_rows = lines[2:]

          new_rows = []
          new_links = []

          for line in data_rows:
              parts = [p.strip() for p in line.split("|") if p.strip()]
              if len(parts) < 9:
                  continue

              link = parts[6]

              if link not in seen:
                  new_rows.append(line)
                  new_links.append(link)

          if not new_rows:
              pathlib.Path("send_email.txt").write_text("false", encoding="utf-8")
          else:
              seen.extend(new_links)
              pathlib.Path("seen_jobs.json").write_text(json.dumps(seen, indent=2), encoding="utf-8")
              final_table = "\n".join([header, separator] + new_rows)
              pathlib.Path("email_body.txt").write_text(final_table, encoding="utf-8")
              pathlib.Path("send_email.txt").write_text("true", encoding="utf-8")
          PY

      - name: Commit memory
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add seen_jobs.json
          git commit -m "update job memory" || echo "no changes"
          git push origin HEAD:main

      - name: Convert table to HTML
        run: |
          python - <<'PY'
          import html, pathlib

          text = pathlib.Path("email_body.txt").read_text(encoding="utf-8").strip()

          if not text:
              html_body = "<html><body><p>No matches</p></body></html>"
          else:
              rows = [r for r in text.splitlines() if r.startswith("|")]

              if len(rows) < 3:
                  html_body = f"<html><body><pre>{html.escape(text)}</pre></body></html>"
              else:
                  header = [c.strip() for c in rows[0].strip("|").split("|")]

                  html_body = "<html><body>"
                  html_body += "<p><strong>New Job Radar Matches</strong></p>"
                  html_body += "<table border='1' cellpadding='6' cellspacing='0' style='border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;'>"
                  html_body += "<tr>" + "".join(f"<th style='background:#f2f2f2;text-align:left;'>{html.escape(h)}</th>" for h in header) + "</tr>"

                  for r in rows[2:]:
                      cells = [c.strip() for c in r.strip("|").split("|")]
                      if len(cells) != len(header):
                          continue
                      html_body += "<tr>"
                      for idx, c in enumerate(cells):
                          if header[idx].lower() == "direct link" and c.startswith("http"):
                              html_body += f"<td><a href='{html.escape(c)}'>Open job</a></td>"
                          else:
                              html_body += f"<td>{html.escape(c)}</td>"
                      html_body += "</tr>"

                  html_body += "</table></body></html>"

          pathlib.Path("email_body.html").write_text(html_body, encoding="utf-8")
          PY

      - name: Load send flag
        id: sendflag
        run: echo "value=$(cat send_email.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.sendflag.outputs.value == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          html_body = pathlib.Path("email_body.html").read_text(encoding="utf-8")
          text_body = pathlib.Path("email_body.txt").read_text(encoding="utf-8")

          payload = {
            "from": "Job Radar <onboarding@resend.dev>",
            "to": [os.environ["EMAIL_TO"]],
            "subject": "New Job Radar Matches",
            "html": html_body,
            "text": text_body
          }

          pathlib.Path("resend_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @resend_payload.json
